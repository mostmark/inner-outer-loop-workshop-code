---
# Java (Spring Boot / Quarkus) components: git-clone -> s2i-java (Java 21) -> Argo CD sync -> rollout status.
# Started by .tasks/pipeline_deploy_coolstore.sh (Pipeline - Deploy Coolstore) with
# ARGOCD_APP_NAME=<svc>-<user>. Needs the Task argocd-task-sync-and-wait (00_argocd-task.yaml),
# the ConfigMap argocd-env-configmap and the Secret argocd-env-secret in the same namespace.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: coolstore-java-pipeline
spec:
  params:
    - name: APP_NAME
      type: string
      description: component name (inventory, catalog, gateway or web)
    - name: APP_GIT_URL
      type: string
      description: Git repository with the source code
    - name: APP_GIT_CONTEXT
      type: string
      description: directory of the component in the Git repository
    - name: NAMESPACE
      type: string
      description: namespace of the target ImageStream (cn-project-<user>)
    - name: APP_GIT_REVISION
      type: string
      description: Git revision to build
      default: main
    - name: ARGOCD_APP_NAME
      type: string
      description: Argo CD Application to sync (<svc>-<user>)
  tasks:
    - name: git-clone
      params:
        - name: URL
          value: $(params.APP_GIT_URL)
        - name: REVISION
          value: $(params.APP_GIT_REVISION)
        - name: SUBMODULES
          value: 'true'
        - name: DEPTH
          value: '1'
        - name: SSL_VERIFY
          value: 'true'
        - name: DELETE_EXISTING
          value: 'true'
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: s2i-java
      params:
        - name: VERSION
          value: openjdk-21-ubi9
        - name: ENV_VARS
          value:
            - "MAVEN_MIRROR_URL=http://nexus.nexus.svc:8081/repository/maven-all-public/"
            - "MAVEN_CLEAR_REPO=true"
        - name: CONTEXT
          value: $(params.APP_GIT_CONTEXT)
        - name: TLS_VERIFY
          value: 'false'
        - name: IMAGE
          value: >-
            image-registry.openshift-image-registry.svc:5000/$(params.NAMESPACE)/$(params.APP_NAME)-coolstore
      runAfter:
        - git-clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: s2i-java
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: argocd-task-sync-and-wait
      params:
        - name: application-name
          value: $(params.ARGOCD_APP_NAME)
      runAfter:
        - s2i-java
      taskRef:
        kind: Task
        name: argocd-task-sync-and-wait
    - name: openshift-client
      params:
        - name: SCRIPT
          value: oc rollout status deployment/$(params.APP_NAME)-coolstore
      runAfter:
        - argocd-task-sync-and-wait
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
  workspaces:
    - name: shared-workspace
