schemaVersion: 2.2.2
metadata:
  name: wksp-end-to-end-dev
  displayName: Inner Loop + Outer Loop Workshop
  description: Workspace for the Red Hat Inner Loop + Outer Loop workshop (Coolstore application)
projects:
  - name: workshop
    git:
      checkoutFrom:
        revision: main
      remotes:
        origin: 'https://github.com/mostmark/inner-outer-loop-workshop-code.git'
components:
  - name: workshop-tools
    attributes:
      # Merge the editor (che-code) runtime into this container instead of adding a second one
      controller.devfile.io/merge-contribution: true
    container:
      image: 'quay.io/mostmark/workshop-tools:latest'
      cpuRequest: 200m
      cpuLimit: 2000m
      memoryRequest: 1Gi
      memoryLimit: 4Gi
      mountSources: true
      sourceMapping: /projects
      env:
        - name: MAVEN_OPTS
          value: '-Xmx1g -Duser.home=/home/developer'
        - name: MAVEN_MIRROR_URL
          value: 'http://nexus.nexus.svc:8081/repository/maven-all-public/'
      endpoints:
        - name: 8080-port
          targetPort: 8080
          exposure: public
          protocol: http
          attributes:
            protocol: http
        - name: 9000-port
          targetPort: 9000
          exposure: public
          protocol: http
          attributes:
            protocol: http
        - name: 5005-port
          targetPort: 5005
          exposure: internal
          protocol: http
          attributes:
            protocol: http
            public: 'false'
      volumeMounts:
        - name: m2
          path: /home/developer/.m2
  - name: m2
    volume:
      size: 10G
# Every command sources .tasks/workshop-env.sh, which provides WORKSHOP_USER, DEV_PROJECT
# (my-project-<user>), STAGING_PROJECT (cn-project-<user>), GITEA_URL and helper functions.
# Values come from the workspace environment (ConfigMap workshop-env, Secret workshop-credentials)
# with fallbacks derived from the Dev Spaces namespace devspaces-<user>.
commands:
  - id: openshift---login
    exec:
      label: OpenShift - Login
      component: workshop-tools
      workingDir: /projects/workshop
      commandLine: '. /projects/workshop/.tasks/workshop-env.sh && workshop_login && oc project "$DEV_PROJECT"'
  - id: openshift---create-development-project
    exec:
      label: OpenShift - Create Development Project
      component: workshop-tools
      workingDir: /projects/workshop
      commandLine: '. /projects/workshop/.tasks/workshop-env.sh && workshop_use_project "$DEV_PROJECT"'
  - id: inventory---compile-dev-mode
    exec:
      label: Inventory - Compile (Dev Mode)
      component: workshop-tools
      workingDir: /projects/workshop/labs/inventory-quarkus
      commandLine: '[[ ! -z "$(ps aux | grep -v grep | grep "compile quarkus:dev" | awk ''{print $2}'')" ]] && echo ''!! Application already running in Dev Mode !!'' || mvn compile quarkus:dev -Ddebug=false'
  - id: inventory---build
    exec:
      label: Inventory - Build
      component: workshop-tools
      workingDir: /projects/workshop/labs/inventory-quarkus
      commandLine: mvn clean package -DskipTests
  - id: inventory---push-component
    exec:
      label: Inventory - Push Component
      component: workshop-tools
      workingDir: /projects/workshop/labs/inventory-quarkus
      commandLine: mvn package -Dquarkus.container-image.build=true -DskipTests -Dquarkus.container-image.group=$(oc project -q) -Dquarkus.kubernetes-client.trust-certs=true
  - id: inventory---deploy-component
    exec:
      label: Inventory - Deploy Component
      component: workshop-tools
      workingDir: /projects/workshop/labs/inventory-quarkus
      commandLine: mvn package -Dquarkus.kubernetes.deploy=true -DskipTests -Dquarkus.container-image.group=$(oc project -q) -Dquarkus.kubernetes-client.trust-certs=true
  - id: catalog---build
    exec:
      label: Catalog - Build
      component: workshop-tools
      workingDir: /projects/workshop/labs/catalog-spring-boot
      commandLine: mvn clean package -DskipTests
  - id: catalog---run
    exec:
      label: Catalog - Run
      component: workshop-tools
      workingDir: /projects/workshop/labs/catalog-spring-boot
      commandLine: mvn spring-boot:run
  - id: catalog---deploy-component
    exec:
      label: Catalog - Deploy Component
      component: workshop-tools
      workingDir: /projects/workshop/labs/catalog-spring-boot
      commandLine: mvn package -DskipTests oc:build oc:resource oc:apply
  - id: gateway---build-and-deploy
    exec:
      label: Gateway - Build and Deploy Component
      component: workshop-tools
      workingDir: /projects/workshop/labs/gateway-dotnet
      commandLine: '. /projects/workshop/.tasks/workshop-env.sh && oc new-build dotnet:9.0 --name gateway-coolstore --labels=component=gateway --env DOTNET_STARTUP_PROJECT=app.csproj --binary=true -n "$DEV_PROJECT" && oc start-build gateway-coolstore --from-dir=. -w -n "$DEV_PROJECT" && oc new-app gateway-coolstore:latest --name gateway-coolstore --labels=app=coolstore,app.kubernetes.io/instance=gateway,app.kubernetes.io/part-of=coolstore,app.kubernetes.io/name=gateway,app.openshift.io/runtime=dotnet,component=gateway -n "$DEV_PROJECT" && oc expose svc gateway-coolstore -n "$DEV_PROJECT"'
  - id: inventory---generate-traffic
    exec:
      label: Inventory - Generate Traffic
      component: workshop-tools
      workingDir: /projects/workshop/labs/inventory-quarkus
      commandLine: '. /projects/workshop/.tasks/workshop-env.sh && for i in {1..60}; do if [ $(curl -s -w "%{http_code}" -o /dev/null http://inventory-coolstore.$DEV_PROJECT.svc:8080/api/inventory/329299) == "200" ]; then MSG="\\033[0;32mThe request to Inventory Service has succeeded\\033[0m"; else MSG="\\033[0;31mERROR - The request to Inventory Service has failed\\033[0m"; fi; echo -e $MSG; sleep 1s; done'
  - id: probes---configure-gateway--web
    exec:
      label: Probes - Configure Gateway & Web
      component: workshop-tools
      workingDir: /projects/workshop
      commandLine: '. /projects/workshop/.tasks/workshop-env.sh && oc project "$DEV_PROJECT"; oc set probe deployment/gateway-coolstore --liveness --readiness --period-seconds=5 --get-url=http://:8080/health; oc set probe deployment/web-coolstore --liveness --readiness --period-seconds=5 --get-url=http://:8080/; echo "Health Probes Done"'
  - id: gateway---generate-traffic
    exec:
      label: Gateway - Generate Traffic
      component: workshop-tools
      workingDir: /projects/workshop/.tasks
      commandLine: '. ./workshop-env.sh && ./gateway_generate_traffic.sh "$STAGING_PROJECT"'
  - id: inner-loop---deploy-coolstore
    exec:
      label: Inner Loop - Deploy Coolstore
      component: workshop-tools
      workingDir: /projects/workshop/.tasks
      commandLine: '. ./workshop-env.sh && ./inner_loop_deploy_coolstore.sh "$DEV_PROJECT"'
  - id: inventory---commit
    exec:
      label: Inventory - Commit
      component: workshop-tools
      workingDir: /projects/workshop/labs/inventory-quarkus
      commandLine: '. /projects/workshop/.tasks/workshop-env.sh && git init -b main; git remote add origin "$GITEA_URL/$WORKSHOP_USER/inventory-quarkus.git" 2> /dev/null || git remote set-url origin "$GITEA_URL/$WORKSHOP_USER/inventory-quarkus.git"; git add -A; git commit -m "Initial"; workshop_git push -u origin main'
  - id: gitops---export-coolstore
    exec:
      label: GitOps - Export Coolstore
      component: workshop-tools
      workingDir: /projects/workshop/.tasks
      commandLine: '. ./workshop-env.sh && ./gitops_export_coolstore.sh "$DEV_PROJECT" "$STAGING_PROJECT"'
  - id: pipeline---deploy-coolstore
    exec:
      label: Pipeline - Deploy Coolstore
      component: workshop-tools
      workingDir: /projects/workshop/.tasks
      commandLine: '. ./workshop-env.sh && oc project "$STAGING_PROJECT" && ./pipeline_deploy_coolstore.sh "$STAGING_PROJECT"'
  - id: gitops---commit-inventory
    exec:
      label: GitOps - Commit Inventory
      component: workshop-tools
      workingDir: /projects/workshop/labs/gitops/inventory-coolstore
      commandLine: '. /projects/workshop/.tasks/workshop-env.sh && git init -b main; git remote add origin "$GITEA_URL/$WORKSHOP_USER/inventory-gitops.git" 2> /dev/null || git remote set-url origin "$GITEA_URL/$WORKSHOP_USER/inventory-gitops.git"; git add -A; git commit -m "Initial Inventory GitOps"; workshop_git push -u origin main'
  - id: gitops---commit--configure-coolstore
    exec:
      label: GitOps - Commit & Configure Coolstore
      component: workshop-tools
      workingDir: /projects/workshop/.tasks
      commandLine: '. ./workshop-env.sh && ./gitops_commit_configure_coolstore.sh "$WORKSHOP_USER"'
  - id: service-mesh---deploy-catalog-and-gateway
    exec:
      label: Service Mesh - Deploy Catalog and Gateway
      component: workshop-tools
      workingDir: /projects/workshop/labs
      commandLine: '. /projects/workshop/.tasks/workshop-env.sh && oc patch deployment/catalog-coolstore --patch ''{"spec": {"template": {"metadata": {"labels": {"sidecar.istio.io/inject": "true"}}}}}'' -n "$STAGING_PROJECT" && oc patch deployment/gateway-coolstore --patch ''{"spec": {"template": {"metadata": {"labels": {"sidecar.istio.io/inject": "true"}}}}}'' -n "$STAGING_PROJECT"'
  - id: openshift---cleanup
    exec:
      label: OpenShift - Cleanup
      component: workshop-tools
      workingDir: /projects/workshop
      commandLine: './.tasks/openshift_cleanup.sh'
